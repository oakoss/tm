name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  static-analysis:
    name: Static Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Harden and checkout
        uses: $/.github/actions/harden-checkout

      - name: Setup
        uses: $/.github/actions/setup

      # Defined once in .mise.toml so local and CI cannot diverge.
      - name: Check
        run: mise run check

      # Merge and fixup exemptions come from cog.toml, which the commit-msg hook
      # reads too.
      - name: Commit messages
        if: github.event_name == 'pull_request'
        run: >
          cog check
          ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}

  tests:
    name: Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Harden and checkout
        uses: $/.github/actions/harden-checkout

      - name: Setup
        uses: $/.github/actions/setup

      - name: Test
        run: mise run test

  cold-start:
    name: Cold start (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Harden and checkout
        uses: $/.github/actions/harden-checkout

      - name: Setup
        uses: $/.github/actions/setup

      # The budget times reads in bubblewrap, which Ubuntu's AppArmor keeps
      # from making the user namespace it needs until this sysctl is off.
      - name: Sandbox
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      # The budget is in build-plan.md's Phase 1 checks.
      - name: Cold-start budget
        run: mise run coldstart

  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Full history, because a secret stays live after the commit that
      # removed it from the tree.
      - name: Harden and checkout
        uses: $/.github/actions/harden-checkout

      # Scoped to gitleaks so this job skips the Rust toolchain.
      - name: Setup
        uses: $/.github/actions/setup
        with:
          tools: gitleaks

      # A backstop: lefthook's pre-commit gitleaks is what stops a secret
      # leaving the machine. `mise run` would otherwise install every tool in
      # .mise.toml before running the task.
      - name: Run gitleaks
        env:
          MISE_AUTO_INSTALL: 'false'
        run: mise run scan-secrets

  # A pull request that changes a package carries a bump file.
  oakum:
    name: Bump files
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    env:
      HAS_BOT: ${{ secrets.BOT_CLIENT_ID != '' }}
    steps:
      - name: Harden and checkout
        uses: $/.github/actions/harden-checkout

      - name: Setup
        uses: $/.github/actions/setup
        with:
          tools: github:oakoss/oakum

      # Posts the release plan as the oakoss App; a pull request without the
      # App's secrets, such as a fork's, posts as github-actions instead.
      - name: Oakoss App token
        id: app-token
        if: env.HAS_BOT == 'true'
        continue-on-error: true
        uses: $/.github/actions/app-token
        with:
          client-id: ${{ secrets.BOT_CLIENT_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}
          repositories: tm
          permission-contents: read
          permission-pull-requests: write

      # The version pull request consumes the bump files and holds a version
      # with no tag yet, which `check --strict` always fails, whoever pushed.
      # A fork's branch of that name is still checked.
      - name: oakum check
        if: >-
          github.head_ref != 'oakum/version-packages'
          || github.event.pull_request.head.repo.full_name != github.repository
        run: oakum check --strict

      - name: oakum ci pr-status
        id: pr-status
        if: success() || failure()
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
        run: oakum ci pr-status

      - name: pr-status failed
        if: (success() || failure()) && steps.pr-status.outcome == 'failure'
        run: echo "::warning title=oakum ci pr-status::the release plan may not have reached the pull request; oakum check still decides"

  # Renovate commits a Cargo update as fix(deps), which asks for a bump file a
  # bot cannot write; this writes it from that commit and pushes it as the
  # oakoss App, whose commits Renovate ignores (gitIgnoredAuthors). See
  # oakum's guide, "Dependency bot pull requests".
  bot-bump-file:
    name: Bump file for Renovate
    if: >-
      github.event_name == 'pull_request'
      && github.event.pull_request.user.login == 'renovate[bot]'
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      HAS_BOT: ${{ secrets.BOT_CLIENT_ID != '' }}
    steps:
      # The pull request's branch, as the default merge ref cannot be pushed.
      - name: Harden and checkout
        uses: $/.github/actions/harden-checkout
        with:
          ref: ${{ github.head_ref }}

      - name: Setup
        uses: $/.github/actions/setup
        with:
          tools: github:oakoss/oakum

      # Only while the branch's changes need a bump file: generate writes a new
      # one on every run, the push starts this workflow again, and with nothing
      # to cover (a chore update, or a file already pushed) generate fails.
      - name: Write the bump file
        id: generate
        env:
          BASE: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$BASE"
          if oakum check --strict --from "origin/$BASE"; then
            exit 0
          fi
          oakum generate --from "origin/$BASE"
          if [ -n "$(git status --porcelain -- .changeset)" ]; then
            echo "written=true" >> "$GITHUB_OUTPUT"
          fi

      # A push with the workflow's own token would leave the new run's checks
      # waiting for approval.
      - name: Oakoss App token
        id: app-token
        if: steps.generate.outputs.written == 'true' && env.HAS_BOT == 'true'
        uses: $/.github/actions/app-token
        with:
          client-id: ${{ secrets.BOT_CLIENT_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}
          repositories: tm
          permission-contents: write
          resolve-identity: 'true'

      - name: Push the bump file
        if: steps.app-token.outputs.token != ''
        env:
          TOKEN: ${{ steps.app-token.outputs.token }}
          BOT_USER: ${{ steps.app-token.outputs.user }}
          BOT_EMAIL: ${{ steps.app-token.outputs.email }}
          HEAD: ${{ github.head_ref }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          git add .changeset
          git -c user.name="$BOT_USER" -c user.email="$BOT_EMAIL" \
            commit -m "chore(changeset): add the bump file for this update"
          git push "https://x-access-token:${TOKEN}@github.com/${REPO}.git" "HEAD:refs/heads/${HEAD}"

  # Its own file because it also runs on a weekly cron against a fresh advisory
  # database. Called here so CI Summary gates it on pull requests.
  audit:
    uses: $/.github/workflows/audit.yml

  ci-summary:
    name: CI Summary
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    needs: [
      static-analysis,
      tests,
      cold-start,
      secret-scan,
      oakum,
      bot-bump-file,
      audit,
    ]
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      # Iterates `needs`, so any job listed there is gated without editing this
      # step; a job omitted from `needs` is ungated.
      #
      # jq writes to a file rather than a process substitution: `< <(...)` puts
      # the producer outside `set -e` and `pipefail`, so a missing jq, malformed
      # JSON, an empty `needs` or a truncated stream would read as zero rows and
      # exit green while a job is failing.
      - name: Gate on all required jobs
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail

          # Keyed on `verdict`, not the exit status: an abort is not always
          # nonzero. The signal traps make a killed or cancelled step report
          # an explicit abort.
          verdict=
          trap 'rc=$?
            if [ -z "$verdict" ]; then
              verdict=aborted
              [ "$rc" -ne 0 ] || rc=1
              echo "::error title=CI gate::gate aborted (exit $rc) before reaching a verdict"
              exit "$rc"
            fi' EXIT INT TERM HUP

          command -v jq >/dev/null || {
            echo "::error title=CI gate::jq not found"
            verdict=reached
            exit 1
          }

          expected=$(printf '%s' "$NEEDS" | jq -r 'length')
          case "$expected" in
            ''|*[!0-9]*)
              echo "::error title=CI gate::could not read the job count from needs"
              verdict=reached
              exit 1
              ;;
          esac
          if [ "$expected" -eq 0 ]; then
            echo "::error title=CI gate::needs is empty — the gate would pass without checking anything"
            verdict=reached
            exit 1
          fi

          printf '%s' "$NEEDS" | jq -r 'to_entries[] | [.key, .value.result] | @tsv' > results.tsv

          {
            echo "## CI Summary"
            echo ""
            echo "| Job | Result |"
            echo "| --- | --- |"
          } >> "$GITHUB_STEP_SUMMARY" ||
            echo "::warning title=CI gate::step summary unwritable; the verdict is unaffected"

          seen=0
          passed=0
          failed=0
          while IFS=$'\t' read -r job result; do
            seen=$((seen + 1))
            # shellcheck disable=SC2016 # the backticks are markdown, not a subshell
            printf '| %s | `%s` |\n' "$job" "$result" >> "$GITHUB_STEP_SUMMARY" || :
            # Only failure and cancellation fail a job here, so a job whose own
            # `if:` skips it does not block a merge.
            case "$result" in
              success)
                passed=$((passed + 1))
                continue
                ;;
              skipped)
                echo "::notice title=CI gate::Job '$job' was skipped"
                continue
                ;;
            esac
            echo "::error title=CI gate::Job '${job:-<empty>}' did not succeed (result: $result)"
            failed=1
          done < results.tsv

          if [ "$seen" -ne "$expected" ]; then
            echo "::error title=CI gate::read $seen of $expected jobs — results were truncated"
            verdict=reached
            exit 1
          fi

          if [ "$failed" -eq 0 ] && [ "$passed" -eq 0 ]; then
            echo "::error title=CI gate::every gated job was skipped — nothing was checked"
            verdict=reached
            exit 1
          fi

          verdict=reached
          exit "$failed"

  # Downstream of the gate on purpose, so not in its `needs`: it versions and
  # releases only a main commit whose CI passed. `!cancelled()`, because GitHub
  # skips a job when any job it needs at any depth was skipped, and Bump files
  # is skipped on every push; a cancelled run still stops the release.
  release:
    needs: ci-summary
    if: ${{ !cancelled() && github.event_name == 'push' && needs.ci-summary.result == 'success' }}
    permissions:
      contents: read
    uses: $/.github/workflows/oakum.yml
    secrets:
      BOT_CLIENT_ID: ${{ secrets.BOT_CLIENT_ID }}
      BOT_PRIVATE_KEY: ${{ secrets.BOT_PRIVATE_KEY }}
