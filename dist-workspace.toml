[workspace]
members = ["cargo:."]

# Config for 'cargo-dist'
[dist]
# The same number as the cargo-dist pin in .mise.toml; `mise run check` fails
# when they differ.
cargo-dist-version = "0.34.0"
ci = "github"
installers = ["shell", "homebrew"]
# musl is a static build for distros whose glibc is older than the runner's.
targets = [
  "x86_64-apple-darwin",
  "aarch64-apple-darwin",
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
  "x86_64-unknown-linux-musl",
]
install-path = "CARGO_HOME"
hosting = "github"
install-updater = false
tap = "oakoss/homebrew-tap"
formula = "tm"
publish-jobs = ["homebrew"]
pr-run-mode = "plan"
github-attestations = true
cargo-auditable = true
# A tag build restores no cache, so no cache entry can reach a release.
cache-builds = false
# Hand edits to release.yml survive `dist generate --mode=ci`; its header lists
# them. Remove this to regenerate, then re-apply them.
allow-dirty = ["ci"]

[dist.github-custom-runners]
global = "ubuntu-latest"

[dist.github-action-commits]
"actions/checkout" = "3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1
"actions/upload-artifact" = "cf430e030ddbb5b0abf93d22962f4752f3646cd9" # v7.0.2
"actions/download-artifact" = "9000827ccba6bdab643e8b6fd33ac0654aef8333" # v8.0.2
"actions/attest" = "1e69f48acb82d1966a394da916b4c1698aa569d6" # v4.2.2
"swatinem/rust-cache" = "d1527c8f67ef9af357290475d4af4b0fab8f12e0" # v2.9.3
