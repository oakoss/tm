# Markdown linting and formatting. rumdl owns .md outright; dprint excludes markdown, so there is exactly one
# writer per file type.

[global]
respect-gitignore = true

disable = [
  "MD001", # heading levels must increment by one
  "MD012", # multiple consecutive blank lines
  "MD013", # line length — prose is wrapped by the editor, not by a rule
  "MD024", # duplicate heading text, which specs and ADRs use by design
  "MD025", # multiple top-level headings
  "MD026", # trailing punctuation in a heading
  "MD029", # ordered list numbering style
  "MD033", # inline HTML
  "MD036", # emphasis used instead of a heading
  "MD037", # spaces inside emphasis markers
  "MD041", # first line must be a top-level heading
  "MD060", # table column alignment
]

# Tool-owned paths that are tracked; `respect-gitignore` covers the rest.
exclude = [".beads"]

[MD007]
indent = 2

[MD046]
style = "fenced"
