# Virtual manifest. `tm-cli` builds the `tm` binary and is the only crate
# published; the rest are internal (`publish = false`).
[workspace]
resolver = "2"
members = ["crates/*"]

# Inherited with `<key>.workspace = true`. `edition` also feeds a line-anchored
# grep in lefthook's rustfmt hook, which reads no manifest, so the value must
# live here. `rust-version` equals the `.mise.toml` pin.
[workspace.package]
authors = ["Jace Babin"]
edition = "2024"
homepage = "https://github.com/oakoss/tm"
license = "MIT"
repository = "https://github.com/oakoss/tm"
rust-version = "1.99.1"

[workspace.dependencies]
tm-core = { path = "crates/tm-core" }
tm-server = { path = "crates/tm-server" }
tm-store = { path = "crates/tm-store" }
tm-sync = { path = "crates/tm-sync" }
tm-tui = { path = "crates/tm-tui" }

clap = { version = "4.6.7", features = ["derive"] }
insta = { version = "1.49.0", features = ["json", "redactions"] }
jiff = "0.2.38"
proptest = "1.12.0"
# The parser alone; the TUI lays its events out itself (TM-160).
pulldown-cmark = { version = "0.13.6", default-features = false }
ratatui = "0.30.2"
rusqlite = { version = "0.41.0", features = ["backup", "bundled", "collation"] }
# The version crossterm already builds; for the TUI's job control.
rustix = { version = "1.1.6", features = ["process", "termios"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# 0.11 detects the SHA-2 instructions at run time; 0.10 needs its `asm`
# feature to be fast on aarch64 (ADR 0006).
sha2 = "0.11.1"
# The version crossterm already builds, so the TUI adds no second copy.
signal-hook = "0.3.18"
thiserror = "2.0.21"
toml = "1.1.8"
# Edits a repo file's Views in place, keeping the rest of it as written.
toml_edit = "0.25.17"
# Off unless TM_LOG asks, and then only to a file (ADR 0020).
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3.23", default-features = false, features = [
  "env-filter",
  "fmt",
  "std",
] }
# The version ratatui already builds.
unicode-width = "0.2.3"
uuid = { version = "1.28.0", features = ["serde", "v7"] }

[workspace.lints.rust]
# `forbid` so no per-module `#[allow(unsafe_code)]` can reopen it.
unsafe_code = "forbid"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
# Size-optimized ("z") builds ran `tm list` about 40% slower at 10,000 Issues.
opt-level = 3

# cargo-dist builds release artifacts with a `dist` profile; without this every
# build job fails with `profile dist is not defined`.
[profile.dist]
inherits = "release"
