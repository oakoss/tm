# cocogitto verifies commit messages in the commit-msg hook and in CI. Nothing
# runs `cog bump` or `cog changelog`; releases go through oakum.

branch_whitelist = ["main"]

# Read by both `cog verify` (the commit-msg hook) and `cog check` (CI), so the
# two callers stay identical by construction. Merge and fixup messages are
# generated by git and cannot be conventional.
ignore_merge_commits = true
ignore_fixup_commits = true
