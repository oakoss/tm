[workspace]
members = ["cargo:."]

# Config for 'cargo-dist'
[dist]
# The same number as the cargo-dist pin in .mise.toml; `mise run check` fails
# when they differ.
cargo-dist-version = "0.33.1"
ci = "github"
installers = ["shell", "homebrew"]
# musl is a static build for distros whose glibc is older than the runner's.
targets = [
  "x86_64-apple-darwin",
  "aarch64-apple-darwin",
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
  "x86_64-unknown-linux-musl",
]
install-path = "CARGO_HOME"
hosting = "github"
install-updater = false
tap = "oakoss/homebrew-tap"
formula = "tm"
publish-jobs = ["homebrew"]
pr-run-mode = "plan"
github-attestations = true
cargo-auditable = true
# A tag build restores no cache, so no cache entry can reach a release.
cache-builds = false
# Hand edits to release.yml survive `dist generate --mode=ci`; its header lists
# them. Remove this to regenerate, then re-apply them.
allow-dirty = ["ci"]

[dist.github-custom-runners]
global = "ubuntu-latest"

[dist.github-action-commits]
"actions/checkout" = "de0fac2e4500dabe0009e67214ff5f5447ce83dd" # v6.0.2
"actions/upload-artifact" = "043fb46d1a93c77aae656e7c1c64a875d1fc6a0a" # v7.0.1
"actions/download-artifact" = "3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c" # v8.0.1
"actions/attest" = "1e69f48acb82d1966a394da916b4c1698aa569d6" # v4
"swatinem/rust-cache" = "6323deb102c322ba6fcbdcafc7e3dddab59af2b6" # v2.9.2
