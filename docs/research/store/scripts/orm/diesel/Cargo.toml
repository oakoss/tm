[package]
name = "diesel"
version = "0.1.0"
edition = "2024"

# Built on its own, outside tm's workspace.
[workspace]

[dependencies]
diesel = { version = "2.3.14", default-features = false, features = ["sqlite"] }
libsqlite3-sys = { version = "0.38", features = ["bundled"] }

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
opt-level = 3
