[tools]
# mise owns the Rust toolchain, components included, so CI installs exactly one
# and `cargo clippy` resolves deterministically.
#
# Exact, not `stable`: `clippy::pedantic` runs under `-D warnings`, so a release
# that adds a lint would turn CI red with no commit anyone reviewed.
#
# This version, Cargo.toml's `rust-version`, and `rust-toolchain.toml`'s
# channel are the same number: release builds install only dist and
# cargo-auditable through mise, so their cargo resolves through the toolchain
# file. Move all three together.
rust = { version = "1.99.1", components = "clippy,rustfmt,rust-src,rust-analyzer" }
lefthook = "2.2.2"
dprint = "0.63.0"
rumdl = "0.2.79"
shellcheck = "0.11.0"
# Reads `$/` self-repo action refs and lints .github/actions/ too.
jactionlint = "2.2.0"
# Security tools resolve through aqua, which verifies checksums on every
# download, rather than being curled in a workflow step.
gitleaks = "8.30.1"
"aqua:EmbarkStudios/cargo-deny" = "0.20.2"
# aqua, not cargo: the cargo backend compiles cocogitto from source on every
# cold CI cache. Exact, because cog parses commit messages for both the
# commit-msg hook and CI.
"aqua:cocogitto/cocogitto" = "7.0.0"
# oakum refuses to write when its binary differs from this pin.
"github:oakoss/oakum" = "0.8.0"
# release.yml installs dist from this pin. Same number as `cargo-dist-version`
# in dist-workspace.toml; `mise run check` fails when they differ. Run it as
# `mise exec -- dist` where Homebrew's dist comes first on PATH.
"aqua:axodotdev/cargo-dist" = "0.33.1"
# Embeds the dependency tree in release binaries (`cargo-auditable = true` in
# dist-workspace.toml); release.yml installs it from here.
"github:rust-secure-code/cargo-auditable" = "0.7.7"

[task_config]
shell = "bash -c"

[tasks.setup]
description = "Bootstrap a fresh clone"
# Work is tracked in tm, installed apart from the build being developed
# (docs/contributing/task-tracking.md).
run = [
  "command -v tm >/dev/null || echo 'setup: tm is not installed; brew install oakoss/tap/tm, or cargo install --locked --path crates/tm-cli'",
  "lefthook install",
]

[tasks.fmt]
description = "Format everything"
run = ["cargo fmt", "dprint fmt", "rumdl fmt ."]

# CI invokes these tasks directly rather than restating their commands, so the
# two cannot drift. `--locked` fails when Cargo.lock is behind Cargo.toml instead
# of silently rewriting it.
[tasks.check]
description = "Static analysis — what CI's static-analysis job runs"
# shellcheck is the command, not an xargs payload: BSD xargs skips the utility
# entirely on empty input. Scripts under docs/research/ record past experiments
# as they ran and are not linted.
run = [
  # Keyed on whether the key exists: an empty core.hooksPath also bypasses
  # lefthook. Exit 1 from git means unset; anything else is a failure.
  "out=$(git config --show-origin --get-all core.hooksPath); case $? in 1) ;; 0) printf 'core.hooksPath is set, so git is bypassing lefthook; unset it where shown:\\n%s\\n' \"$out\"; exit 1;; *) echo 'could not read core.hooksPath'; exit 1;; esac",
  # Local `dist` and release.yml run the mise pin; dist-workspace.toml's
  # `cargo-dist-version` is what `dist generate` writes for. mise reads its own
  # pin, and awk only the [dist] table, so a moved key reads as empty.
  '''pin=$(mise current aqua:axodotdev/cargo-dist); dist=$(awk -F'"' '/^\[/ { table = $0 } table == "[dist]" && /^cargo-dist-version *=/ { print $2 }' dist-workspace.toml); [ -n "$pin" ] && [ "$pin" = "$dist" ] || { echo "cargo-dist: .mise.toml pins '$pin', dist-workspace.toml [dist] has '$dist'; make them equal"; exit 1; }''',
  "cargo fmt --check",
  "cargo clippy --workspace --all-targets --locked -- -D warnings",
  "dprint check",
  "rumdl check .",
  "shellcheck $(git ls-files '*.sh' ':!docs/research/**')",
  # Pyflakes is off: no workflow has a `shell: python` step. shellcheck is
  # named so a missing binary fails the check instead of skipping `run:` blocks.
  "jactionlint --pyflakes= --shellcheck=shellcheck",
]

[tasks.audit]
description = "Dependency advisories, licenses, and sources — what CI's audit job runs"
# `--workspace` roots the graph at every member; without it a member's
# exclusive dependencies are never seen.
run = "cargo-deny --workspace --locked check all"

[tasks.scan-secrets]
description = "Secret scan over full history — what CI's secret-scan job runs"
# `--redact` keeps a matched secret out of world-readable CI logs.
run = "gitleaks detect --no-banner --redact --source ."

[tasks.coldstart]
description = "Cold-start budget for read commands on a release build — what CI's cold-start job runs"
run = "cargo test --release --locked -p tm-cli --test coldstart -- --ignored --nocapture"

[tasks.test]
description = "Tests — what CI's tests job runs"
# `--all-targets` silently drops doctests, so the second command is not
# redundant with the first.
run = [
  "cargo test --workspace --all-targets --locked",
  "cargo test --workspace --doc --locked",
]

[tasks.ci]
description = "Every CI job's task, in turn"
# In turn, not as `depends`: mise runs dependencies in parallel, and the
# cold-start budget timed beside a build measures the build.
run = [
  "mise run check",
  "mise run test",
  "mise run audit",
  "mise run scan-secrets",
  "mise run coldstart",
]
