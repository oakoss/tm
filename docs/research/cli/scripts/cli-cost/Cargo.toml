[package]
name = "cli-cost"
version = "0.0.0"
edition = "2024"
publish = false

# Standalone: not a member of tm's workspace.
[workspace]

[dependencies]
# Same version and bundled SQLite as tm-store (Cargo.lock: rusqlite 0.40.2).
rusqlite = { version = "=0.40.2", features = ["bundled"] }
serde_json = "1"
tm-core = { path = "../../../../../crates/tm-core" }
tm-store = { path = "../../../../../crates/tm-store" }
uuid = { version = "1", features = ["v7"] }

# The same release profile as tm's workspace, so the probe's tm-store and the
# tm binary are built alike.
[profile.release]
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
opt-level = "z"
